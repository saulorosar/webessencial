<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Raio-X · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,650&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f4f5f8; --surface: #ffffff; --ink: #141925; --muted: #5d6576; --line: #e0e3ea;
  --accent: #2343d1; --on-accent: #ffffff; --down: #c03a33; --down-soft: #fae6e4;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0e1219; --surface: #161b24; --ink: #e7eaf1; --muted: #9aa2b2; --line: #2a303c;
  --accent: #86a0ff; --on-accent: #0e1219; --down: #f17a72; --down-soft: #3a1c1b; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; }
.mark { font-family: var(--display); font-weight: 650; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 650; font-size: 26px; line-height: 1.15; }
p { margin: 0; color: var(--muted); font-size: 14px; }
form { display: flex; flex-direction: column; gap: 14px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; }
input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 9px; padding: 12px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.manter { flex-direction: row; align-items: flex-start; gap: 8px; font-weight: 500; }
.manter input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.manter small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.err { background: var(--down-soft); color: var(--down); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main class="card">
  <div>
    <div class="mark">Raio-X</div>
    <h1>Acesse seus painéis</h1>
  </div>
  <p>Entre com o e-mail e a senha que você recebeu.</p>
  <form id="f" autocomplete="on" action="#" onsubmit="event.preventDefault()">
    <label for="u">E-mail<input id="u" name="username" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label for="s">Senha<input id="s" name="password" type="password" autocomplete="current-password" required></label>
    <label class="manter" for="m"><input id="m" type="checkbox"><span>Manter conectado neste aparelho por 30 dias<small>Use só em computador ou celular pessoal.</small></span></label>
    <div class="err" id="err" hidden></div>
    <button id="b" type="submit" disabled>Entrar</button>
  </form>
  <div class="foot">Acesso restrito</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const enc = (s) => new TextEncoder().encode(s);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const hex = (u8) => [...u8].map((b) => b.toString(16).padStart(2, '0')).join('');
const ITER = 300000;
const showErr = (t) => { $('err').textContent = t; $('err').hidden = false; };
$('u').focus();
if (!window.crypto || !crypto.subtle) showErr('Este navegador não consegue abrir o painel. Atualize o navegador ou use outro.');
else $('b').disabled = false;

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('err').hidden = true;
  const email = $('u').value.trim().toLowerCase();
  const senha = $('s').value.normalize('NFC');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || !senha) { showErr('E-mail ou senha incorretos.'); return; }
  $('b').disabled = true; $('b').textContent = 'Verificando…';
  try {
    const salt = new Uint8Array(await crypto.subtle.digest('SHA-256', enc('raiox-salt:' + email)));
    const base = await crypto.subtle.importKey('raw', enc(senha), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, 512));
    const arq = hex(bits.slice(0, 16));
    const key = await crypto.subtle.importKey('raw', bits.slice(32, 64), 'AES-GCM', false, ['decrypt']);
    let r;
    try { r = await fetch(`../u/${arq}.json`, { cache: 'no-store' }); }
    catch (_) { showErr('Sem conexão com o site. Confira a internet e tente de novo.'); throw _; }
    if (!r.ok) throw new Error('não encontrado');
    const c = await r.json();
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(c.iv), additionalData: enc(arq) }, key, b64(c.ct));
    const acesso = JSON.parse(new TextDecoder().decode(pt));
    const lista = (acesso.paineis || [{ p: acesso.p, k: acesso.k, nome: '', perfil: '' }]).filter((x) => /^[a-z0-9]{10}$/.test(x.p));
    if (!lista.length) throw new Error('acesso inválido');
    // limpa qualquer acesso anterior neste navegador e grava o novo
    [sessionStorage, localStorage].forEach((st) => { try { Object.keys(st).filter((k) => k.startsWith('raiox:')).forEach((k) => st.removeItem(k)); } catch (_) {} });
    const manter = $('m').checked;
    try {
      const st = manter ? localStorage : sessionStorage;
      if (manter) st.setItem('raiox:expira', String(Date.now() + 30 * 86400000));
      lista.forEach((x) => st.setItem('raiox:' + x.p, x.k));
      st.setItem('raiox:sessao', JSON.stringify({ email, paineis: lista.map(({ k, ...resto }) => resto) }));
    } catch (_) { showErr('O navegador bloqueou o acesso. Saia da janela anônima ou libere os dados do site.'); throw _; }
    location.href = lista.length === 1 ? `../p/${lista[0].p}/` : '../meus/';
  } catch (err) {
    if ($('err').hidden) showErr('E-mail ou senha incorretos.');
    $('b').disabled = false; $('b').textContent = 'Entrar';
  }
});
</script>
</body>
</html>
